[package]
name = "real_estate_allocation_data"
version = "0.1.0"
edition = "2024"

# The dashboard as a `kind: page` microfrontend: `<mfe-real-estate-data>`, served by
# REA under `/mfe/data/` and mounted by the estate host at `/data`. Built with
# `wasm-bindgen --target web` (manganis-free, see `ev_lib::mfe`), like the embeds.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
dioxus-fullstack = { workspace = true, features = ["web"] }
ev_lib = { workspace = true, features = ["wasm", "mfe"] }
real_estate_allocation.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Element"] }

[lints]
workspace = true
